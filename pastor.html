</head>
<body>

  <header>
    <div class="header-inner">
      <div class="globe">TELL</div>
      <div class="brand">
        <h1>Tellworld Ministry</h1>
        <p>Sharing the Gospel to the Ends of the Earth</p>
      </div>
    </div>
  </header>

  <nav>
    <div class="nav-inner">
      <a href="index.html">Home</a>
      <a href="pastor.html" class="active">Pastor</a>
      <a href="devotional.html">Devotional</a>
      <a href="announcements.html">Announcements</a>
      <a href="ministry.html">Ministry</a>
      <a href="moments.html">Moments</a>
      <a href="evangelism.html">Evangelism</a>

      <a href="giving.html">Giving</a>
      <a href="prayer.html">Prayer</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="page-title">
    <h2>🎤 Pastor's Messages</h2>
    <p>Weekly preaching and teachings</p>
  </div>

  <div class="container">
    <a href="index.html" class="back-btn">← Back Home</a>
    <div id="posts-container">
      <p style="text-align:center; color:#7fa3d4; font-size:12px;">Loading messages...</p>
    </div>
  </div>

  <footer>
    <span class="globe-sm"></span><strong>Tellworld Ministry</strong><br>
    © 2025 All rights reserved.
  </footer>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, where, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(window.firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById("posts-container");

    async function load() {
      try {
        const q = query(
          collection(db, "posts"),
          where("type", "==", "pastor"),
        );
        const snap = await getDocs(q);
        if (snap.empty) {
          container.innerHTML = "<p style='text-align:center; color:#7fa3d4; font-size:12px;'>No messages yet. Check back soon!</p>";
          return;
        }
        container.innerHTML = "";
        const items = [];
snap.forEach((d) => items.push(d.data()));

// Sort in JS instead of Firestore
items.sort((a, b) => {
  const ta = a.createdAt?.seconds || 0;
  const tb = b.createdAt?.seconds || 0;
  return tb - ta;
});

items.forEach((p) => {
  const el = document.createElement("div");
  el.className = "post";
  el.innerHTML = `
    <h4>${esc(p.title)}</h4>
    <div class="meta">📅 ${date(p.createdAt)}</div>
    <p>${esc(p.body).replace(/\n/g, "<br>")}</p>
  `;
  container.appendChild(el);
});
      } catch (err) {
        container.innerHTML = `<p style='text-align:center; color:#ff6b6b; font-size:12px;'>${err.message}</p>`;
      }
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
    function date(ts) { try { return ts.toDate().toLocaleDateString(); } catch { return "—"; } }

    load();
  </script>

</body>
</html>
