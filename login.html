<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Tellworld Ministry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="globe">TELL</div>
      <div class="brand">
        <h1>Tellworld Ministry</h1>
        <p>Sharing the Gospel to the Ends of the Earth</p>
      </div>
    </div>
  </header>

  <div class="container">
    <a href="index.html" class="back-btn">← Back Home</a>

    <div class="form-wrap">
      <h3>Member Login</h3>
      <p class="sub">Welcome back to Tellworld Ministry</p>

      <form onsubmit="event.preventDefault(); alert('Login system coming soon in Step 9!');">
        <label>Email or Name</label>
        <input type="text" placeholder="Enter email or your name" required>

        <label>Phone Number (as password)</label>
        <input type="tel" placeholder="Enter your phone number" required>

        <button type="submit">Login</button>
      </form>

      <p class="form-note">
        New here? Contact the admin to register.
      </p>
    </div>
  </div>

  <footer>
    <span class="globe-sm"></span><strong>Tellworld Ministry</strong><br>
    © 2025 All rights reserved.
  </footer>

</body>
</html>
